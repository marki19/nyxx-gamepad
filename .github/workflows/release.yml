name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x client/gradlew

      - name: Build APK
        working-directory: client
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nyxx-Android
          path: client/app/build/outputs/apk/debug/app-debug.apk

  build-server:
    name: Build Windows Server
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Server Executable
        run: dotnet publish server/server.csproj -c Release -o builds -p:UseAppHost=true

      - name: Install Inno Setup
        run: choco install innosetup

      - name: Compile Setup Installer
        run: iscc installer/installer.iss

      - name: Upload Server artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nyxx-Server
          path: builds/NyxxServer_Setup.exe

  create-release:
    name: Create GitHub Release
    needs: [build-android, build-server]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: Nyxx-Android
          path: release-artifacts

      - name: Download Server Artifact
        uses: actions/download-artifact@v4
        with:
          name: Nyxx-Server
          path: release-artifacts

      - name: Prepare APK Name
        run: |
          cp release-artifacts/app-debug.apk release-artifacts/Nyxx.apk

      - name: Determine Tag & Release Details
        id: release_meta
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "title=Release ${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "title=Latest Build" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.title }}
          prerelease: ${{ steps.release_meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            release-artifacts/Nyxx.apk
            release-artifacts/NyxxServer_Setup.exe
